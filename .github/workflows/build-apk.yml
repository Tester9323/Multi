name: Build MultiBrowser Pro Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.7
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build with Gradle
        run: |
          /tmp/gradle-8.7/bin/gradle assembleDebug --stacktrace

      - name: Verify APK generated
        run: |
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK successfully generated!"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "ERROR: APK not found!"
            find app/build/outputs/ -type f -name "*.apk" || true
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: multibrowser-pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
